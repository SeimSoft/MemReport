{% extends "base.html" %}

{% block title %}Freigabe nicht gefunden | MemReport{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card text-center">
    <div class="mb-4 text-amber-400 flex justify-center">
      <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold mb-2">Freigabe nicht verfügbar</h1>
    <p class="text-muted mb-6">{{ message }}</p>
    <a href="/login" class="btn btn-secondary inline-block">Zur Anmeldeseite</a>
  </div>
</div>
{% endblock %}
