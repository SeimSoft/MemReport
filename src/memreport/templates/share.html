{% extends "base.html" %}

{% block title %}{{ title }} | MemReport Share{% endblock %}

{% block content %}
<div class="share-public-layout">
  <!-- Header -->
  <header class="share-header">
    <div class="share-header-left">
      <div class="header-logo">
        <svg width="22" height="22" class="w-6 h-6 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span class="font-bold text-base tracking-tight text-slate-200">MemReport</span>
      </div>
    </div>

    <!-- Prominenter, rechtsbündiger Umschalt-Button (Bericht / Karte) -->
    <div class="share-header-right">
      <div class="share-view-switcher" id="share-view-switcher">
        <button class="view-tab active" id="tab-share-report" onclick="switchSharePublicView('report')">
          <svg width="16" height="16" class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span>Bericht</span>
        </button>
        <button class="view-tab" id="tab-share-map" onclick="switchSharePublicView('map')">
          <svg width="16" height="16" class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
          <span>Karte</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Content Container -->
  <main class="share-main-container custom-scroll">
    <!-- Report View -->
    <div id="share-report-pane" class="share-pane active">
      <!-- Einheitlicher kompakter Header (wie im Haupt-Viewer) -->
      <div class="report-header-bar share-report-header-bar">
        <!-- Zeile 1: <, Datum, > zusammen in einer Zeile -->
        <div class="report-header-nav-row">
          <button id="btn-share-prev" class="header-nav-btn" onclick="navigateSharedReport(-1)" title="Vorheriger Bericht (chronologisch)">
            <svg width="20" height="20" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>

          <h2 id="share-current-date-heading" class="current-date-title">Lade...</h2>

          <button id="btn-share-next" class="header-nav-btn" onclick="navigateSharedReport(1)" title="Nächster Bericht (chronologisch)">
            <svg width="20" height="20" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </div>

        <!-- Zeile 2: Dadrunter Ort und Vorlesen -->
        <div class="report-header-actions-row">
          <div id="share-location-badge-container" class="location-badge hidden">
            <svg width="14" height="14" class="w-3.5 h-3.5 mr-1 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span id="share-location-text">Standort</span>
          </div>

          <!-- TTS Read Aloud Button in Share View -->
          <button id="btn-share-read-aloud" class="btn-read-aloud" onclick="toggleShareReadAloud()" title="Diesen Bericht vorlesen (Google TTS)">
            <svg width="14" height="14" class="tts-speaker-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            </svg>
            <svg width="14" height="14" class="tts-spinner-icon hidden animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" stroke-opacity="0.3"></circle>
              <path fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span id="share-read-aloud-label">Vorlesen</span>
          </button>
          <audio id="share-audio-player" class="hidden"></audio>
        </div>
      </div>

      <div class="share-content-wrapper">
        <div class="share-report-card">
          <div id="share-rendered-content" class="markdown-body">
            <!-- Rendered content with Markdown, HTML, KaTeX and Base64 images -->
          </div>
        </div>
      </div>
    </div>

    <!-- Map View -->
    <div id="share-map-pane" class="share-pane">
      <div id="share-leaflet-map" class="share-leaflet-map"></div>
    </div>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
  const SHARE_TOKEN = "{{ token }}";
  // Dynamically resolve base URL path to support reverse proxy subpaths like /memreport
  const sharePathIdx = window.location.pathname.indexOf('/share/');
  const API_BASE = sharePathIdx >= 0 ? window.location.pathname.substring(0, sharePathIdx) : '';

  let currentSelectedDate = null;
  let sortedDates = {% if dates_json %}{{ dates_json | safe }}{% else %}[]{% endif %};
  if (Array.isArray(sortedDates)) sortedDates.sort();
  const reportsCache = {};
  let shareLocationsData = null;
  let isMapDataLoading = false;
  let shareMap = null;
  let shareMarkersLayer = null;
  let shareRoutesLayer = null;

  function padZero(num) {
    return String(num).padStart(2, '0');
  }

  function formatDateGerman(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dateObj = new Date(y, m - 1, d);
    const weekdays = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
    const w = weekdays[dateObj.getDay()];
    const yy = String(y).slice(-2);
    return `${w}, ${padZero(d)}.${padZero(m)}.${yy}`;
  }

  async function loadSharedReport() {
    console.log('[MemReport Share] Initializing loadSharedReport, token:', SHARE_TOKEN, 'API_BASE:', API_BASE);
    try {
      if (!sortedDates || sortedDates.length === 0) {
        console.log('[MemReport Share] Fetching share info...');
        const res = await fetch(`${API_BASE}/api/public/shares/${SHARE_TOKEN}/info`);
        if (!res.ok) throw new Error('Freigabelink konnte nicht geladen werden (Status ' + res.status + ')');
        const info = await res.json();
        sortedDates = (info.dates || []).sort();
        console.log('[MemReport Share] Loaded dates from info:', sortedDates);
      }

      if (sortedDates.length === 0) {
        console.warn('[MemReport Share] No dates available for this share');
        document.getElementById('share-rendered-content').innerHTML = `
          <div class="alert alert-info">Keine Berichte für diesen Freigabelink vorhanden.</div>
        `;
        document.getElementById('share-current-date-heading').textContent = 'Keine Berichte';
        updateShareNavButtons();
        return;
      }

      let initialDate = sortedDates[0];
      try {
        const params = new URLSearchParams(window.location.search);
        const qDate = params.get('date');
        if (qDate && sortedDates.includes(qDate)) {
          initialDate = qDate;
        }
      } catch (e) {}

      console.log('[MemReport Share] Selecting initial date:', initialDate);
      selectSharedDate(initialDate);
    } catch (err) {
      console.error('[MemReport Share] Error initializing:', err);
      document.getElementById('share-rendered-content').innerHTML = `
        <div class="alert alert-error">Fehler beim Laden des Berichts: ${err.message}</div>
      `;
    }
  }

  function updateShareNavButtons() {
    const prevBtn = document.getElementById('btn-share-prev');
    const nextBtn = document.getElementById('btn-share-next');
    if (!prevBtn || !nextBtn) return;

    if (!sortedDates || sortedDates.length <= 1) {
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      prevBtn.title = 'Kein früherer Bericht';
      nextBtn.title = 'Kein späterer Bericht';
      return;
    }

    const olderDates = sortedDates.filter(d => d < currentSelectedDate);
    const newerDates = sortedDates.filter(d => d > currentSelectedDate);

    if (olderDates.length > 0) {
      prevBtn.disabled = false;
      const target = olderDates[olderDates.length - 1];
      prevBtn.title = `Vorheriger Bericht (${formatDateGerman(target)})`;
    } else {
      prevBtn.disabled = true;
      prevBtn.title = 'Kein früherer Bericht';
    }

    if (newerDates.length > 0) {
      nextBtn.disabled = false;
      const target = newerDates[0];
      nextBtn.title = `Nächster Bericht (${formatDateGerman(target)})`;
    } else {
      nextBtn.disabled = true;
      nextBtn.title = 'Kein späterer Bericht';
    }
  }

  function navigateSharedReport(direction) {
    if (!sortedDates || !sortedDates.length) return;
    if (direction < 0) {
      const olderDates = sortedDates.filter(d => d < currentSelectedDate);
      if (olderDates.length > 0) {
        selectSharedDate(olderDates[olderDates.length - 1]);
      }
    } else if (direction > 0) {
      const newerDates = sortedDates.filter(d => d > currentSelectedDate);
      if (newerDates.length > 0) {
        selectSharedDate(newerDates[0]);
      }
    }
  }

  async function selectSharedDate(date) {
    if (!date) return;
    currentSelectedDate = date;
    updateShareNavButtons();

    try {
      const url = new URL(window.location.href);
      url.searchParams.set('date', date);
      window.history.replaceState({ date }, '', url.toString());
    } catch (e) {}

    const headingEl = document.getElementById('share-current-date-heading');
    const locContainer = document.getElementById('share-location-badge-container');
    const locText = document.getElementById('share-location-text');
    const contentEl = document.getElementById('share-rendered-content');

    headingEl.textContent = formatDateGerman(date);
    resetShareAudio();

    console.log('[MemReport Share] selectSharedDate:', date);
    if (reportsCache[date]) {
      console.log('[MemReport Share] Report retrieved from cache for date:', date);
      displayReport(reportsCache[date]);
      return;
    }

    // Show lightweight loading indicator while fetching only this single report
    contentEl.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 1rem;color:var(--text-muted);gap:0.75rem;">
        <svg style="width:28px;height:28px;animation:spin 1s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-opacity="0.25"></circle>
          <path fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span style="font-size:0.875rem;">Lade Bericht für ${formatDateGerman(date)}...</span>
      </div>
    `;

    try {
      const fetchUrl = `${API_BASE}/api/public/shares/${SHARE_TOKEN}/reports/${date}`;
      console.log('[MemReport Share] Fetching report URL:', fetchUrl);
      const res = await fetch(fetchUrl);
      if (!res.ok) {
        throw new Error(`Bericht konnte nicht geladen werden (HTTP ${res.status})`);
      }
      const report = await res.json();
      console.log('[MemReport Share] Report received for date:', date, 'length:', report?.content?.length);
      reportsCache[date] = report;

      if (currentSelectedDate === date) {
        displayReport(report);
      }
    } catch (err) {
      console.error('[MemReport Share] Fetch report error:', err);
      if (currentSelectedDate === date) {
        contentEl.innerHTML = `
          <div class="alert alert-error">Fehler beim Laden des Berichts: ${err.message}</div>
        `;
      }
    }

    function displayReport(report) {
      if (report && report.latitude && report.longitude) {
        locContainer.classList.remove('hidden');
        locText.textContent = report.location_name || 'Standort hinterlegt';
        locContainer.title = `Standort: ${report.location_name || ''} (GPS: ${report.latitude.toFixed(4)}, ${report.longitude.toFixed(4)})`;
      } else {
        locContainer.classList.add('hidden');
      }

      if (!report || !report.content) {
        contentEl.innerHTML = '<p class="text-muted">Kein Inhalt für dieses Datum verfügbar.</p>';
        return;
      }

      renderContent(report.content, contentEl);
    }
  }

  function renderContent(rawText, container) {
    if (!rawText) {
      container.innerHTML = '<p class="text-muted">Dieser Bericht ist leer.</p>';
      return;
    }

    // Parse Markdown (mixed HTML allowed)
    marked.setOptions({
      breaks: true,
      gfm: true
    });

    let html = marked.parse(rawText);
    container.innerHTML = html;

    // Syntax highlight code blocks
    try {
      container.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });
    } catch (e) {
      console.warn("Syntax highlighting failed:", e);
    }

    // KaTeX math rendering
    try {
      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      }
    } catch (e) {
      console.warn("KaTeX rendering failed:", e);
    }
    try {
      renderInteractiveComponents(container);
    } catch (e) {
      console.warn("Interactive components rendering failed:", e);
    }
  }

  function renderInteractiveComponents(container) {
    if (!container) return;

    // 1. Interactive Plotly Charts
    container.querySelectorAll("pre code.language-plotly").forEach((block) => {
      try {
        const rawJson = block.textContent.trim();
        const spec = JSON.parse(rawJson);
        const preEl = block.closest("pre");
        if (!preEl) return;

        const widget = document.createElement("div");
        widget.className = "interactive-plotly-widget";
        const plotId = "plotly-" + Math.random().toString(36).substring(2, 10);
        widget.id = plotId;
        preEl.parentNode.replaceChild(widget, preEl);

        const layout = spec.layout || {};
        layout.paper_bgcolor = layout.paper_bgcolor || "rgba(0,0,0,0)";
        layout.plot_bgcolor = layout.plot_bgcolor || "rgba(0,0,0,0)";
        layout.font = Object.assign({ color: "#f8fafc", family: "Inter, sans-serif" }, layout.font || {});
        layout.autosize = true;

        const config = Object.assign({ responsive: true, displayModeBar: true, displaylogo: false }, spec.config || {});

        if (window.Plotly) {
          Plotly.newPlot(widget, spec.data || [], layout, config);
        }
      } catch (err) {
        console.warn("Failed rendering interactive plotly widget:", err);
      }
    });

    // 2. Interactive Leaflet Route Maps
    container.querySelectorAll("pre code.language-leaflet, pre code.language-geojson").forEach((block) => {
      try {
        const rawJson = block.textContent.trim();
        const spec = JSON.parse(rawJson);
        const preEl = block.closest("pre");
        if (!preEl) return;

        const mapContainer = document.createElement("div");
        mapContainer.className = "interactive-map-widget";
        const mapId = "map-" + Math.random().toString(36).substring(2, 10);
        mapContainer.id = mapId;
        preEl.parentNode.replaceChild(mapContainer, preEl);

        if (!window.L) return;

        const map = L.map(mapId, {
          scrollWheelZoom: false,
          attributionControl: true
        }).setView([51.1657, 10.4515], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
        }).addTo(map);

        let latLngs = [];

        if (spec.type === "FeatureCollection" || spec.type === "Feature" || spec.type === "LineString") {
          const geoLayer = L.geoJSON(spec, {
            style: {
              color: "#0284c7",
              weight: 5,
              opacity: 0.95
            }
          }).addTo(map);
          try {
            map.fitBounds(geoLayer.getBounds(), { padding: [35, 35] });
          } catch (e) {}
        } else if (spec.coordinates && Array.isArray(spec.coordinates) && spec.coordinates.length > 0) {
          latLngs = spec.coordinates.map(pt => [pt[0], pt[1]]);
          const polyline = L.polyline(latLngs, {
            color: "#0284c7",
            weight: 4.5,
            opacity: 0.95,
            lineJoin: "round"
          }).addTo(map);

          const startIcon = L.divIcon({
            className: "custom-pin",
            html: "<div class=\"route-marker-pin route-marker-start\" style=\"width:24px;height:24px;\">S</div>",
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          L.marker(latLngs[0], { icon: startIcon })
            .addTo(map)
            .bindPopup(`<b>Start</b><br>${spec.title || "Startpunkt"}`);

          const finishIcon = L.divIcon({
            className: "custom-pin",
            html: "<div class=\"route-marker-pin route-marker-finish\" style=\"width:24px;height:24px;\">Z</div>",
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          const lastPt = latLngs[latLngs.length - 1];

          let distKm = spec.distance_km;
          if ((distKm === null || distKm === undefined) && latLngs.length > 1) {
            let totalMeters = 0;
            for (let i = 1; i < latLngs.length; i++) {
              totalMeters += L.latLng(latLngs[i - 1][0], latLngs[i - 1][1]).distanceTo(
                L.latLng(latLngs[i][0], latLngs[i][1])
              );
            }
            distKm = totalMeters / 1000;
          }

          let finishMsg = `<b>Ziel</b>`;
          if (distKm) finishMsg += `<br>Distanz: ${distKm.toFixed(2)} km`;
          if (spec.elevation_gain_m) finishMsg += `<br>Höhenmeter: +${Math.round(spec.elevation_gain_m)} m`;
          L.marker(lastPt, { icon: finishIcon })
            .addTo(map)
            .bindPopup(finishMsg);

          map.fitBounds(polyline.getBounds(), { padding: [35, 35] });
        }

        setTimeout(() => {
          map.invalidateSize();
        }, 300);
      } catch (err) {
        console.warn("Failed rendering interactive map widget:", err);
      }
    });
  }


  function switchSharePublicView(view) {
    const reportTab = document.getElementById('tab-share-report');
    const mapTab = document.getElementById('tab-share-map');
    const reportPane = document.getElementById('share-report-pane');
    const mapPane = document.getElementById('share-map-pane');

    if (view === 'report') {
      reportTab.classList.add('active');
      mapTab.classList.remove('active');
      reportPane.classList.add('active');
      mapPane.classList.remove('active');
    } else {
      mapTab.classList.add('active');
      reportTab.classList.remove('active');
      mapPane.classList.add('active');
      reportPane.classList.remove('active');
      initShareMap();
    }
  }

  function extractRoutesFromContent(content) {
    const routes = [];
    if (!content) return routes;
    const regex = /```(?:leaflet|geojson)\s*\n([\s\S]*?)\n```/gi;
    let m;
    while ((m = regex.exec(content)) !== null) {
      try {
        const data = JSON.parse(m[1].trim());
        if (data.coordinates && Array.isArray(data.coordinates) && data.coordinates.length > 0) {
          routes.push({
            title: data.title || 'GPS Route',
            coordinates: data.coordinates,
            distance_km: data.distance_km,
            elevation_gain_m: data.elevation_gain_m
          });
        }
      } catch (e) {}
    }
    return routes;
  }

  function initShareMap() {
    if (!shareMap) {
      shareMap = L.map('share-leaflet-map', {
        zoomControl: true,
        scrollWheelZoom: true
      }).setView([51.1657, 10.4515], 6);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
        maxZoom: 19
      }).addTo(shareMap);

      shareRoutesLayer = L.layerGroup().addTo(shareMap);

      if (window.L && L.markerClusterGroup) {
        shareMarkersLayer = L.markerClusterGroup({
          showCoverageOnHover: false,
          maxClusterRadius: 45,
          spiderfyOnMaxZoom: true,
          iconCreateFunction: function(cluster) {
            const count = cluster.getChildCount();
            let sizeClass = '';
            let iconSize = [36, 36];
            if (count >= 10) {
              sizeClass = 'cluster-large';
              iconSize = [48, 48];
            } else if (count >= 4) {
              sizeClass = 'cluster-medium';
              iconSize = [42, 42];
            }
            return L.divIcon({
              html: `<div class="count-bubble ${sizeClass}">${count}</div>`,
              className: 'count-cluster-icon',
              iconSize: iconSize,
              iconAnchor: [iconSize[0] / 2, iconSize[1] / 2]
            });
          }
        });

        shareMarkersLayer.on('clusterclick', function(c) {
          if (shareMap.getZoom() >= 14 && c.layer && c.layer.getAllChildMarkers) {
            const markers = c.layer.getAllChildMarkers();
            if (markers.length > 1) {
              let html = `<div class="cluster-popup-container">
                <div class="cluster-popup-title"><span>${markers.length} Berichte hier</span></div>`;
              markers.forEach(m => {
                if (m._reportData) {
                  const rep = m._reportData;
                  html += `
                    <div class="cluster-item">
                      <div class="cluster-item-header">
                        <span class="cluster-item-date">${rep.date}</span>
                        <span class="cluster-item-loc">${rep.location_name || 'Standort'}</span>
                      </div>
                      <button class="btn btn-primary btn-xs cluster-item-btn" onclick="selectAndShowSharedReport('${rep.date}')">
                        Bericht ansehen
                      </button>
                    </div>
                  `;
                }
              });
              html += `</div>`;
              L.popup().setLatLng(c.latlng).setContent(html).openOn(shareMap);
            }
          }
        });

        shareMap.addLayer(shareMarkersLayer);
      } else {
        shareMarkersLayer = L.layerGroup().addTo(shareMap);
      }

      shareMap.on('zoomend', () => {
        if (!shareMap || !shareRoutesLayer) return;
        if (shareMap.getZoom() >= 9) {
          if (!shareMap.hasLayer(shareRoutesLayer)) shareMap.addLayer(shareRoutesLayer);
        } else {
          if (shareMap.hasLayer(shareRoutesLayer)) shareMap.removeLayer(shareRoutesLayer);
        }
      });
    }

    setTimeout(() => {
      shareMap.invalidateSize();
      renderShareMapMarkers();
    }, 200);
  }

  async function renderShareMapMarkers() {
    if (!shareMarkersLayer || !shareRoutesLayer) return;
    shareMarkersLayer.clearLayers();
    shareRoutesLayer.clearLayers();

    if (!shareLocationsData) {
      if (isMapDataLoading) return;
      isMapDataLoading = true;
      try {
        const res = await fetch(`${API_BASE}/api/public/shares/${SHARE_TOKEN}/locations`);
        if (res.ok) {
          shareLocationsData = await res.json();
        }
      } catch (err) {
        console.error('Fehler beim Laden der Kartendaten:', err);
      } finally {
        isMapDataLoading = false;
      }
    }

    if (!shareLocationsData || !shareLocationsData.length) return;

    const bounds = [];

    shareLocationsData.forEach(item => {
      const date = item.date;
      const routes = item.routes || [];
      const lat = item.latitude;
      const lon = item.longitude;
      const locName = item.location_name || item.name || 'Standort';

      if (lat && lon) {
        bounds.push([lat, lon]);

        const singleIcon = L.divIcon({
          html: `<div class="count-bubble cluster-single" title="${locName}">1</div>`,
          className: 'count-cluster-icon',
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        const marker = L.marker([lat, lon], { icon: singleIcon });
        marker._reportData = { date: date, location_name: locName };
        marker.bindPopup(`
          <div class="map-popup-card">
            <div class="text-xs font-bold text-primary mb-1">${date}</div>
            <h4 class="font-bold text-sm mb-1">${locName}</h4>
            <button class="btn btn-primary btn-xs w-full mt-2" onclick="selectAndShowSharedReport('${date}')">
              Bericht ansehen
            </button>
          </div>
        `);
        shareMarkersLayer.addLayer(marker);

        // Render GPS route polylines
        routes.forEach(route => {
          if (route.coordinates && route.coordinates.length > 0) {
            route.coordinates.forEach(pt => bounds.push(pt));

            const polyline = L.polyline(route.coordinates, {
              color: '#0284c7',
              weight: 4.5,
              opacity: 0.92,
              lineCap: 'round',
              lineJoin: 'round',
              className: 'route-track-polyline'
            });

            polyline.bindPopup(`
              <div class="map-popup-card route-popup-card">
                <div class="text-xs font-bold text-primary mb-1">🗺️ GPS Aktivität (${date})</div>
                <h4 class="font-bold text-sm mb-1">${route.title || 'GPS Route'}</h4>
                ${route.distance_km ? `<p class="text-xs text-muted">Distanz: ${route.distance_km.toFixed(2)} km</p>` : ''}
                ${route.elevation_gain_m ? `<p class="text-xs text-muted mb-2">Höhenmeter: +${Math.round(route.elevation_gain_m)} m</p>` : ''}
                <button class="btn btn-primary btn-xs w-full mt-2" onclick="selectAndShowSharedReport('${date}')">
                  Bericht ansehen
                </button>
              </div>
            `);

            polyline.on('mouseover', function() {
              this.setStyle({ color: '#38bdf8', weight: 6.5, opacity: 1 });
            });
            polyline.on('mouseout', function() {
              this.setStyle({ color: '#0284c7', weight: 4.5, opacity: 0.92 });
            });

            shareRoutesLayer.addLayer(polyline);

            // Start & Finish markers
            const startPt = route.coordinates[0];
            const lastPt = route.coordinates[route.coordinates.length - 1];

            const startIcon = L.divIcon({
              className: 'custom-pin',
              html: '<div class="route-marker-pin route-marker-start" style="width:22px;height:22px;">S</div>',
              iconSize: [22, 22],
              iconAnchor: [11, 11]
            });
            const startMarker = L.marker(startPt, { icon: startIcon });
            startMarker.bindPopup(`<b>Start</b>: ${route.title || 'Start'}<br><button class="btn btn-primary btn-xs w-full mt-2" onclick="selectAndShowSharedReport('${date}')">Bericht ansehen</button>`);
            shareRoutesLayer.addLayer(startMarker);

            const finishIcon = L.divIcon({
              className: 'custom-pin',
              html: '<div class="route-marker-pin route-marker-finish" style="width:22px;height:22px;">Z</div>',
              iconSize: [22, 22],
              iconAnchor: [11, 11]
            });
            const finishMarker = L.marker(lastPt, { icon: finishIcon });
            finishMarker.bindPopup(`<b>Ziel</b>: ${route.title || 'Ziel'}<br><button class="btn btn-primary btn-xs w-full mt-2" onclick="selectAndShowSharedReport('${date}')">Bericht ansehen</button>`);
            shareRoutesLayer.addLayer(finishMarker);
          }
        });
      }
    });

    if (bounds.length > 0) {
      shareMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
    }
  }

  function selectAndShowSharedReport(date) {
    switchSharePublicView('report');
    selectSharedDate(date);
  }

  function downloadCurrentSharedReport() {
    if (!currentSelectedDate || !reportsCache[currentSelectedDate]) return;
    const report = reportsCache[currentSelectedDate];
    const blob = new Blob([report.content], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `report-${currentSelectedDate}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function resetShareAudio() {
    const audio = document.getElementById('share-audio-player');
    const btn = document.getElementById('btn-share-read-aloud');
    if (audio) {
      audio.pause();
      audio.removeAttribute('src');
    }
    if (btn) {
      btn.classList.remove('is-playing', 'is-loading');
      btn.querySelector('.tts-speaker-icon')?.classList.remove('hidden');
      btn.querySelector('.tts-spinner-icon')?.classList.add('hidden');
      const label = document.getElementById('share-read-aloud-label');
      if (label) label.textContent = 'Vorlesen';
    }
  }

  function toggleShareReadAloud() {
    if (!currentSelectedDate) return;
    const btn = document.getElementById('btn-share-read-aloud');
    const speakerIcon = btn.querySelector('.tts-speaker-icon');
    const spinnerIcon = btn.querySelector('.tts-spinner-icon');
    const label = document.getElementById('share-read-aloud-label');
    const audio = document.getElementById('share-audio-player');

    if (!audio) return;

    // Toggle pause if currently playing
    if (!audio.paused && !audio.ended && audio.currentTime > 0) {
      audio.pause();
      btn.classList.remove('is-playing');
      label.textContent = 'Vorlesen';
      return;
    }

    // Resume if paused and same source
    const targetSrc = `${API_BASE}/api/public/shares/${SHARE_TOKEN}/reports/${currentSelectedDate}/audio`;
    if (audio.src && audio.src.endsWith(targetSrc) && audio.currentTime > 0 && !audio.ended) {
      audio.play();
      btn.classList.add('is-playing');
      label.textContent = 'Pause';
      return;
    }

    // Load new audio
    btn.classList.add('is-loading');
    spinnerIcon.classList.remove('hidden');
    speakerIcon.classList.add('hidden');
    label.textContent = 'Erstelle Audio...';

    audio.src = targetSrc;
    audio.load();

    audio.oncanplaythrough = () => {
      btn.classList.remove('is-loading');
      btn.classList.add('is-playing');
      spinnerIcon.classList.add('hidden');
      speakerIcon.classList.remove('hidden');
      label.textContent = 'Pause';
      audio.play();
    };

    audio.onended = () => {
      btn.classList.remove('is-playing', 'is-loading');
      spinnerIcon.classList.add('hidden');
      speakerIcon.classList.remove('hidden');
      label.textContent = 'Vorlesen';
      audio.currentTime = 0;
    };

    audio.onerror = () => {
      btn.classList.remove('is-playing', 'is-loading');
      spinnerIcon.classList.add('hidden');
      speakerIcon.classList.remove('hidden');
      label.textContent = 'Vorlesen';
      alert('Audio konnte nicht geladen oder generiert werden.');
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadSharedReport);
  } else {
    loadSharedReport();
  }
</script>
{% endblock %}
