[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memreport"
version = "0.1.0"
description = "FastAPI & Uvicorn daily report viewer with calendar, maps, base64 support, and public sharing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.1.2",
    "jinja2>=3.1.3",
    "aiosqlite>=0.20.0",
    "gTTS>=2.5.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
memreport = "memreport.main:start"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
